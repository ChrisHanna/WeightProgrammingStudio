[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "neural-foundry"
version = "0.1.0"
description = "Local-first tools for verifiable neural weight programming"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "python/neural_foundry/data/THIRD_PARTY_NOTICES.txt"]
readme = "README.md"
dependencies = []

[project.scripts]
nf-studio = "neural_foundry.studio:main"

[project.optional-dependencies]
cord-receipts = ["pyarrow==26.0.1", "transformers==4.57.3"]
peft = ["torch==2.9.1", "transformers==4.57.3", "peft==0.18.0"]
peft-qlora = ["torch==2.9.1", "transformers==4.57.3", "peft==0.18.0", "bitsandbytes==0.49.1"]
nemo-automodel = ["nemo-automodel==0.7.0", "torch==2.10.0", "triton==3.6.0", "transformers==5.18.0", "torchao==0.18.0", "torchdata==0.11.0", "datasets==5.1.0"]
nemo-automodel-qlora = ["nemo-automodel==0.7.0", "torch==2.10.0", "triton==3.6.0", "transformers==5.18.0", "torchao==0.18.0", "torchdata==0.11.0", "datasets==5.1.0", "bitsandbytes==0.49.1"]
# Install with the explicit CPU index documented in protocols/core-testing-v1.md.
differential = ["torch==2.9.1+cpu"]
dev = [
    "pytest==8.4.2",
    "maturin==1.16.0",
    "build==1.6.1",
    "ruff==0.17.3",
    "mypy==1.20.2",
]

[tool.maturin]
manifest-path = "crates/nf-python/Cargo.toml"
python-source = "python"
module-name = "neural_foundry._native"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
