name: M2 component evidence and audit verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  m2-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      KIROCREW_SCRATCH: ${{ runner.temp }}/nf-m2-${{ github.run_id }}
      NF_M2_SCRATCH: ${{ runner.temp }}/nf-m2-${{ github.run_id }}
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python build and verification tools
        run: |
          mkdir -p "$NF_M2_SCRATCH"
          python -m pip install --upgrade pip uv
          uv venv --python "$(command -v python)" .venv
          UV_CACHE_DIR="$NF_M2_SCRATCH/uv-cache" uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            pytest maturin ruff mypy safetensors torch
      - name: Explicit local CPU sandbox runtime (no model weights)
        run: docker pull python@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
      - name: Build native binaries, examples, and Python extension
        run: |
          cargo build --locked --workspace --examples
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --locked
          echo "NF_CLI=$PWD/target/debug/nf" >> "$GITHUB_ENV"
      - name: Rust capability inventory, sandbox isolation, and 20-point audit gates
        run: |
          cargo test --locked -p nf-core --lib capabilities -- --test-threads=1
          .venv/bin/python -m pytest -q \
            tests/test_m2_capabilities.py \
            tests/test_sandbox_isolation.py \
            tests/test_paired_controls.py \
            tests/test_paired_statistics.py \
            tests/test_split_broker.py \
            tests/test_audit_20_points.py \
            --basetemp="$NF_M2_SCRATCH/pytest"
