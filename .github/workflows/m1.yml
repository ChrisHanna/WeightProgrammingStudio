name: M1 native and isolated wheel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_DB: control_plane_test
          # Passwordless authentication is confined to this ephemeral CI service.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_BUILD_JOBS: '2'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned development and CPU reference tools
        run: |
          KIROCREW_SCRATCH="$RUNNER_TEMP/nf-m1"
          echo "KIROCREW_SCRATCH=$KIROCREW_SCRATCH" >> "$GITHUB_ENV"
          mkdir -p "$KIROCREW_SCRATCH"
          python -m pip install --upgrade pip uv
          uv venv --python "$(command -v python)" .venv
          UV_CACHE_DIR="$KIROCREW_SCRATCH/uv-cache" uv pip install --python .venv/bin/python \
            --index-strategy unsafe-best-match -r requirements-dev.lock
      - name: Explicit local CPU sandbox runtime (no model weights)
        run: docker pull python@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
      - name: Qualified native gates and executable example
        run: |
          cargo check --workspace --locked
          cargo build -p nf-python --locked
          cargo test --workspace --locked --no-run
          unshare -U --map-current-user --keep-caps \
            setpriv --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            cargo test --workspace --locked --offline -- --test-threads=2
          cargo build -p nf-cli --locked
          cargo build -p nf-cli --example offline_direct --locked
          cargo build -p nf-experiments --example fixture_broker --locked
          cargo build -p nf-experiments --example fixture_sandbox --locked
          cargo build -p nf-experiments --example fixture_splits --locked
          cargo build -p nf-experiments --example fixture_exposure --locked
          env -i PATH="" ./target/debug/examples/offline_direct python/neural_foundry/data/m1_fixture.json "$KIROCREW_SCRATCH/native-store"
          .venv/bin/python scripts/check_dependencies.py
      - name: Bounded native parser mutation smoke
        run: |
          cargo build -p nf-weight-ir --example parser_fuzz_smoke --locked
          (ulimit -v 524288; ulimit -t 20; ./target/debug/examples/parser_fuzz_smoke)
      - name: Control-plane types, CPU preflight and full pytest suite
        env:
          CP_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/control_plane_test
        run: |
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --locked
          .venv/bin/python -m mypy --python-version 3.12 --follow-imports=silent python/neural_foundry/control_plane
          .venv/bin/python -m pytest -q tests/test_weight_edit_drift_diagnostic.py -k layer_strength_sweep_cpu_smoke
          export NF_CLI="$PWD/target/debug/nf"
          .venv/bin/python -m pytest -q --basetemp="$KIROCREW_SCRATCH/pytest"
